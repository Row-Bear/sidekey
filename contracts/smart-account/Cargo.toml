[package]
name = "smart-account"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = "2"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
